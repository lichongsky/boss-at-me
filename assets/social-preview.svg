<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B1F7A"/>
      <stop offset="1" stop-color="#14123A"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <g stroke="#FFFFFF" stroke-linecap="round" opacity="0.08">
    <line x1="640" y1="90" x2="1220" y2="70" stroke-width="10"/>
    <line x1="700" y1="560" x2="1240" y2="580" stroke-width="8"/>
  </g>
  <image href="logo.svg" x="70" y="70" width="500" height="500"/>
  <text x="640" y="250" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="96" font-weight="800" fill="#FFFFFF">boss-at-me</text>
  <text x="644" y="330" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="40" font-weight="600" fill="#C9D3FF">老板 @ 你，AI 先替你想好怎么回</text>
  <text x="644" y="400" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="28" fill="#8F9BD6">读代码、文档和聊天记录起草回复</text>
  <text x="644" y="444" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="28" fill="#8F9BD6">私聊你确认后，以你本人身份发出</text>
  <g font-family="Menlo, monospace" font-size="24" fill="#5CF2FF">
    <rect x="640" y="490" width="610" height="56" rx="14" fill="#0A1030" stroke="#3A4C88"/>
    <text x="664" y="527">$ npm i -g github:lichongsky/boss-at-me</text>
  </g>
</svg>
